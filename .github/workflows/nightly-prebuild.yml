name: Nightly prebuild

# Scheduler. Dispatches ONE `Prebuild extension` run per extension rather than
# building everything inside a single run.
#
# Reusable workflows do not help here: a `uses:` job nests into the CALLING run,
# so all of its jobs still count toward that one run. The full matrix is ~2480
# build jobs, and a run that size makes the Actions UI unusable. Separate
# `workflow_dispatch` runs are the only way to actually split them -- ~38 runs of
# at most ~132 jobs each.
#
# Only extensions with at least one MISSING cell are dispatched. A steady-state
# night where upstream published nothing new dispatches nothing at all; see
# scripts/check-prebuilt-coverage.py for how "missing" is determined, and
# `force` below to rebuild regardless.
#
# See docs/prebuilt-oci.md for the matrix axes and the cell identity.

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Dispatch just this extension (ext_name), empty for all"
        required: false
        default: ""
      force:
        description: "Dispatch even for extensions whose cells all exist"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two overlapping schedulers would dispatch each extension twice. Queue rather
# than cancel: a cancelled scheduler leaves an arbitrary subset dispatched.
concurrency:
  group: nightly-prebuild-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # dispatch the per-extension workflow
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch one run per extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by check-prebuilt-coverage.py for the GHCR token exchange, so
          # the check also sees packages that are not public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          NAMESPACE: ${{ github.repository_owner }}/gpie-ext
          REF: ${{ github.ref_name }}
        run: |
          # Explicit rather than relying on the runner's default shell flags: a
          # failed validation below must abort before anything is dispatched.
          set -euo pipefail

          # `only` is a workflow input (untrusted), so it is charset-checked and
          # passed through the environment rather than interpolated.
          if [ -n "$ONLY" ] && ! printf '%s' "$ONLY" | grep -Eq '^[a-z0-9_]{1,64}$'; then
            echo "refusing malformed 'only' input: $ONLY" >&2
            exit 1
          fi

          if [ -n "$ONLY" ]; then
            # Validate it against the declared targets before dispatching, so a
            # typo fails here instead of in a run that builds nothing.
            python3 scripts/gen-prebuild-matrix.py --only "$ONLY" --min-shards >/dev/null
          fi

          # Dispatch only what is actually missing from GHCR. The scheduled run
          # is the steady-state case: on a night where upstream published no new
          # release and no new PHP patch landed, every cell already exists and
          # this dispatches nothing.
          #
          # An unreadable cell counts as missing, so the failure mode is a
          # redundant rebuild rather than a silently skipped one. The one case
          # where that is too blunt is a registry-wide outage, which would
          # report the whole matrix missing -- `--fail-on-registry-error` makes
          # the step fail there instead of queueing thousands of jobs.
          #
          # `force` skips the check entirely and rebuilds everything in scope.
          if [ "$FORCE" = "true" ]; then
            echo "force=true: skipping the coverage check"
            if [ -n "$ONLY" ]; then
              EXTS="[\"$ONLY\"]"
            else
              EXTS="$(python3 scripts/gen-prebuild-matrix.py --list-extensions)"
            fi
          else
            # One pass, not two: `--report` writes the per-extension table to
            # stderr (the step log, so a skipped night is auditable) while
            # `--emit-json` puts the list on stdout. Running the checker twice
            # would double the GHCR requests and risk being throttled into
            # reporting everything as missing.
            EXTS="$(python3 scripts/check-prebuilt-coverage.py \
              --namespace "$NAMESPACE" ${ONLY:+--only "$ONLY"} \
              --report --emit-json --fail-on-registry-error)"
          fi

          printf '%s' "$EXTS" | python3 -c 'import json,sys; [print(e) for e in json.load(sys.stdin)]' > exts.txt
          total="$(wc -l < exts.txt | tr -d " ")"

          if [ "$total" -eq 0 ]; then
            echo "Every declared cell already exists in GHCR; nothing to dispatch."
            {
              echo "### Nightly prebuild: nothing to do"
              echo ""
              echo "Every declared cell already exists in \`$NAMESPACE\`."
              echo "Re-run with \`force\` to rebuild anyway."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Dispatching $total run(s) on $REF"

          # Dispatched serially: the API allows 500 workflow runs per 10s, and
          # ~38 sequential calls stay far under that while keeping the failure
          # mode obvious (a failed dispatch is one named extension, not a batch).
          failed=0
          while read -r ext; do
            [ -n "$ext" ] || continue
            if gh workflow run prebuild-extension.yml \
                 --ref "$REF" -f extension="$ext"; then
              echo "  dispatched $ext"
            else
              echo "::warning::failed to dispatch $ext"
              failed=$((failed + 1))
            fi
          done < exts.txt

          if [ "$failed" -gt 0 ]; then
            echo "$failed dispatch(es) failed" >&2
            exit 1
          fi

          {
            echo "### Nightly prebuild dispatched"
            echo ""
            if [ "$FORCE" = "true" ]; then
              echo "$total per-extension run(s) on \`$REF\` (forced, coverage check skipped)."
            else
              echo "$total extension(s) with missing cells, on \`$REF\`:"
              echo ""
              sed 's/^/- /' exts.txt
            fi
            echo ""
            echo "Each builds its own cells and publishes its own index; watch"
            echo "them in the [Prebuild extension](../../actions/workflows/prebuild-extension.yml) workflow."
          } >> "$GITHUB_STEP_SUMMARY"
