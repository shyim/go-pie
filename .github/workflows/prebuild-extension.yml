name: Prebuild extension

# Builds every cell of ONE extension and publishes its per-version OCI indexes.
#
# Dispatched by `Nightly prebuild`, one run per extension. Splitting by run (not
# by reusable workflow) is deliberate: a `uses:` job nests into the calling run,
# so the whole matrix would still land in a single run of ~2480 jobs and make the
# Actions UI unusable. One run per extension caps it at ~132.
#
# Also directly dispatchable to rebuild a single extension.

on:
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension (ext_name) to build"
        required: true
      shards:
        description: "Build shards (blank = fewest that fit the matrix cap)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # build attestations
  attestations: write

# One in-flight run per extension. A second run for the same extension would
# race the first's cell pushes and could publish a mixed index.
concurrency:
  group: prebuild-${{ github.repository }}-${{ inputs.extension }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}/gpie-ext

jobs:
  # ---- Expand just this extension's slice of the matrix ---------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      index: ${{ steps.plan.outputs.index }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan matrix
        id: plan
        env:
          EXT: ${{ inputs.extension }}
          SHARDS: ${{ inputs.shards }}
        run: |
          # Both are workflow inputs (untrusted): charset-check them and pass via
          # argv, never interpolated into a shell string.
          if ! printf '%s' "$EXT" | grep -Eq '^[a-z0-9_]{1,64}$'; then
            echo "refusing malformed 'extension' input: $EXT" >&2
            exit 1
          fi
          if [ -n "$SHARDS" ] && { ! printf '%s' "$SHARDS" | grep -Eq '^[0-9]{1,3}$' || [ "$SHARDS" -lt 1 ]; }; then
            echo "refusing malformed 'shards' input: $SHARDS" >&2
            exit 1
          fi

          python3 scripts/gen-prebuild-matrix.py --only "$EXT" --check

          # Default to the fewest shards that keep every shard under GitHub's
          # 256-job matrix cap, computed from the matrix itself. Every single
          # extension fits in one shard today, but this keeps working if one
          # grows past 256 cells.
          MIN="$(python3 scripts/gen-prebuild-matrix.py --only "$EXT" --min-shards)"
          if [ -z "$SHARDS" ] || [ "$SHARDS" -lt "$MIN" ]; then
            if [ -n "$SHARDS" ]; then
              echo "::warning::raising shards from $SHARDS to $MIN to fit the matrix cap"
            fi
            SHARDS="$MIN"
          fi
          echo "Using $SHARDS shard(s) for $EXT"

          printf 'shards=' >> "$GITHUB_OUTPUT"
          SHARDS="$SHARDS" python3 -c "import json,os;n=int(os.environ['SHARDS']);print(json.dumps([f'{i}/{n}' for i in range(n)]))" >> "$GITHUB_OUTPUT"
          printf 'index=' >> "$GITHUB_OUTPUT"
          python3 scripts/gen-prebuild-matrix.py --only "$EXT" --group-index >> "$GITHUB_OUTPUT"

  # ---- Build every cell of this extension -----------------------------------
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    uses: ./.github/workflows/prebuild-shard.yml
    with:
      shard: ${{ matrix.shard }}
      only: ${{ inputs.extension }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # ---- Aggregate this extension's cells into one index per version ---------
  index:
    needs: [plan, build]
    # `fail-fast: false` lets individual cells fail, but a matrix job with any
    # failed cell is itself failed, which would skip indexing and waste every
    # cell that did succeed. Run whenever the workflow was not cancelled; the
    # step below still skips an ext@version with no cell tags at all.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.index) }}
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin

      # Discover this version's per-cell tags and merge them into `ext:version`.
      #
      # The cell id must land on each INDEX DESCRIPTOR, not just on the child
      # manifest: gpie's ResolvePrebuilt scans descriptors in order and, for any
      # descriptor lacking the annotation, fetches that child manifest to read
      # it. With hundreds of cells per version an unannotated index turns one
      # lookup into hundreds of serial round-trips, on every miss.
      #
      # `oras manifest index create --annotation` does NOT do this -- it writes
      # index-level annotations only, and oras exposes no per-descriptor
      # annotation flag (verified against oras 1.3.0). So build the index with
      # `-o -`, inject the annotations into `manifests[]`, and push the result
      # with `oras manifest push`. Requires oras >= 1.3 for `manifest index`.
      - name: Create/refresh version index
        env:
          EXT_NAME: ${{ matrix.ext_name }}
          VER: ${{ matrix.version }}
        run: |
          REPO="$REGISTRY/$NAMESPACE/$EXT_NAME"
          # All per-cell tags for this version look like `<ver>-<suffix>`. Anchor
          # on the full version segment so 6.2.0 does not also match 6.2.0RC1.
          mapfile -t TAGS < <(oras repo tags "$REPO" 2>/dev/null | grep -E "^${VER}-" || true)
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "::warning::no cell tags for $REPO:$VER; nothing to index"
            exit 0
          fi

          # Map each child manifest digest to its cell id, so the injector can
          # annotate descriptors by digest rather than by position.
          #
          # The cell id is read out of the manifest BODY with a JSON parser, not
          # `--format go-template`: that template renders the descriptor, which
          # carries no annotations, so `index .annotations` aborts the whole
          # command with "index of untyped nil" instead of returning empty.
          : > cells.tsv
          KEEP=()
          for tag in "${TAGS[@]}"; do
            body="$(oras manifest fetch "$REPO:$tag" 2>/dev/null || true)"
            descriptor="$(oras manifest fetch "$REPO:$tag" --descriptor 2>/dev/null || true)"
            cell="$(printf '%s' "$body" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print((d.get("annotations") or {}).get("sh.gpie.cell",""))' \
              2>/dev/null || true)"
            digest="$(printf '%s' "$descriptor" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("digest",""))' 2>/dev/null || true)"
            if ! printf '%s' "$cell" | grep -Eq '^[A-Za-z0-9._@/+-]{1,200}$'; then
              echo "::warning::skipping $tag: missing or malformed sh.gpie.cell ($cell)"
              continue
            fi
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::warning::skipping $tag: could not resolve its manifest digest"
              continue
            fi
            printf '%s\t%s\n' "$digest" "$cell" >> cells.tsv
            KEEP+=("$tag")
          done
          if [ "${#KEEP[@]}" -eq 0 ]; then
            echo "::warning::no annotatable cells for $REPO:$VER; nothing to index"
            exit 0
          fi
          echo "Indexing ${#KEEP[@]} cell(s) into $REPO:$VER"

          oras manifest index create "$REPO:$VER" -o index.json "${KEEP[@]}"
          python3 - <<'PY'
          import json
          cells = {}
          with open("cells.tsv") as fh:
              for line in fh:
                  digest, _, cell = line.rstrip("\n").partition("\t")
                  if digest and cell:
                      cells[digest] = cell
          index = json.load(open("index.json"))
          missing = 0
          for descriptor in index.get("manifests", []):
              cell = cells.get(descriptor.get("digest"))
              if cell:
                  descriptor.setdefault("annotations", {})["sh.gpie.cell"] = cell
              else:
                  missing += 1
          if missing:
              # Descriptors without the annotation still resolve, just slowly
              # (the client falls back to fetching the child manifest).
              print(f"::warning::{missing} descriptor(s) left unannotated")
          json.dump(index, open("index.json", "w"), separators=(",", ":"))
          print(f"annotated {len(index.get('manifests', [])) - missing} descriptor(s)")
          PY
          oras manifest push "$REPO:$VER" \
            --media-type application/vnd.oci.image.index.v1+json index.json

  # ---- Fail the run if indexing did not happen -----------------------------
  # Individual cell failures are expected and tolerated (a cell can fail for
  # upstream reasons), but unreachable published cells are not.
  verify:
    needs: [build, index]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check outcomes
        env:
          EXT: ${{ inputs.extension }}
          BUILD_RESULT: ${{ needs.build.result }}
          INDEX_RESULT: ${{ needs.index.result }}
        run: |
          echo "$EXT: build=$BUILD_RESULT index=$INDEX_RESULT"
          if [ "$INDEX_RESULT" = "failure" ]; then
            echo "indexing failed; published cells may not be reachable" >&2
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ]; then
            echo "::warning::$EXT had cell failures; see the shard logs"
          fi
