name: Prebuild shard

# One shard of the nightly prebuild matrix. Called by nightly-prebuild.yml.
#
# This is a separate reusable workflow because GitHub caps a single matrix at
# 256 jobs and evaluates `strategy.matrix` before any job runs: the parent
# cannot fan out over a matrix it computed AND shard it in the same job. The
# parent fans out over shard ids; each call expands its own slice here.

on:
  workflow_call:
    inputs:
      shard:
        description: "Shard to build, as `index/total`"
        required: true
        type: string
      only:
        description: "Build only this extension (ext_name), empty for all"
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}/gpie-ext

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      count: ${{ steps.expand.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand shard
        id: expand
        env:
          SHARD: ${{ inputs.shard }}
          ONLY: ${{ inputs.only }}
        run: |
          # Both inputs are revalidated here rather than trusted from the
          # caller: this is a reusable workflow, so the parent's checks are not
          # the only entry point. Values reach the generator via argv, never
          # interpolated into a shell string.
          if ! printf '%s' "$SHARD" | grep -Eq '^[0-9]{1,3}/[0-9]{1,3}$'; then
            echo "refusing malformed shard: $SHARD" >&2
            exit 1
          fi
          if [ -n "$ONLY" ] && ! printf '%s' "$ONLY" | grep -Eq '^[a-z0-9_]{1,64}$'; then
            echo "refusing malformed only: $ONLY" >&2
            exit 1
          fi
          printf 'matrix=' >> "$GITHUB_OUTPUT"
          python3 scripts/gen-prebuild-matrix.py --shard "$SHARD" \
            ${ONLY:+--only "$ONLY"} | tee /tmp/matrix.json >> "$GITHUB_OUTPUT"
          printf 'count=' >> "$GITHUB_OUTPUT"
          python3 -c "import json;print(len(json.load(open('/tmp/matrix.json'))['include']))" >> "$GITHUB_OUTPUT"

  build:
    needs: expand
    # An empty shard (more shards than cells, or `only` filtering everything
    # out) would make the matrix invalid, so skip the job entirely.
    if: ${{ needs.expand.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.expand.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # CGO_ENABLED=0 so the one binary runs in both glibc and musl images.
      - run: CGO_ENABLED=0 go build -trimpath -o gpie .

      # Build the extension inside the exact target image and emit OCI files.
      # package/version come from the generated matrix (trusted: they are
      # charset-validated Packagist names), but are still passed via env + argv
      # rather than interpolated into a shell string.
      - name: Emit prebuilt artifact
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
          TS: ${{ matrix.ts }}
        run: |
          mkdir -p out
          # `--install-system-deps` installs the extension's own system
          # dependencies, not the base build toolchain. Debian php images ship
          # autoconf/gcc/make preinstalled, but Alpine ones ship none of them,
          # so phpize there fails with "Cannot find autoconf". The official
          # images publish the exact package set as $PHPIZE_DEPS; install it
          # first on Alpine. Verified against php:8.4-zts-alpine3.24, which
          # fails without this and succeeds with it.
          docker run --rm -e PKG -e VER -e GITHUB_REPOSITORY \
            -v "$PWD/gpie":/usr/local/bin/gpie \
            -v "$PWD/out":/out \
            "$IMAGE" \
            sh -c '
              set -e
              if command -v apk >/dev/null 2>&1 && ! command -v autoconf >/dev/null 2>&1; then
                apk add --no-cache --virtual .phpize-deps $PHPIZE_DEPS
              fi
              gpie build "$PKG:$VER" --install-system-deps --emit-oci /out
            '
          # cell.txt is produced inside the container, so validate it against a
          # strict charset before it becomes an environment value and, later, an
          # OCI tag. A single well-formed line also removes any heredoc concern.
          CELL_RAW="$(tr -d '\r' < out/cell.txt | head -n 1)"
          if ! printf '%s' "$CELL_RAW" | grep -Eq '^[A-Za-z0-9._@/+-]{1,200}$'; then
            echo "refusing malformed cell identity from out/cell.txt: $CELL_RAW" >&2
            exit 1
          fi
          echo "CELL=$CELL_RAW" >> "$GITHUB_ENV"

          # The cell id carries the distro label gpie derived from
          # /etc/os-release inside the image, plus the thread-safety token it
          # detected. Cross-check both against what this matrix cell intended:
          # a mismatch means we would publish a cell no client will ever ask
          # for (Alpine reports a patch-level VERSION_ID, e.g. alpine@3.24.1),
          # or that the image tag does not have the threading we assumed.
          echo "cell: $CELL_RAW"
          case "$CELL_RAW" in
            *"/$TS/"*) ;;
            *)
              echo "cell $CELL_RAW does not carry the expected thread-safety '$TS'" >&2
              exit 1
              ;;
          esac
          ls -la out

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin

      # Push this cell to a unique per-cell tag. The `sh.gpie.cell` annotation
      # is written on the image manifest; the index job copies it onto the index
      # descriptor so a client resolves a cell in one GET.
      - name: Push cell artifact
        id: push
        env:
          EXT_NAME: ${{ matrix.ext_name }}
          VER: ${{ matrix.version }}
          PHP: ${{ matrix.php }}
          TS: ${{ matrix.ts }}
          ARCH: ${{ matrix.arch }}
        run: |
          REPO="$REGISTRY/$NAMESPACE/$EXT_NAME"
          # A filesystem-safe per-cell tag suffix. The cell id already encodes
          # php/distro/arch/ts/debug/config-hash, so this is unique per cell and
          # stable across runs (a rebuild overwrites its own tag).
          SUFFIX="$(printf '%s' "$CELL" | tr '/@' '__')"
          CELL_TAG="$VER-$SUFFIX"
          # The distro label is read back from the cell rather than the matrix,
          # so the annotation always matches what the client computes.
          DISTRO="$(printf '%s' "$CELL" | cut -d/ -f4)"
          digest="$(oras push "$REPO:$CELL_TAG" \
            --format go-template='{{.digest}}' \
            --artifact-type application/vnd.gpie.ext.config.v1+json \
            --config out/config.json:application/vnd.gpie.ext.config.v1+json \
            --annotation "sh.gpie.cell=$CELL" \
            --annotation "sh.gpie.php=$PHP" \
            --annotation "sh.gpie.distro=$DISTRO" \
            --annotation "sh.gpie.arch=$ARCH" \
            --annotation "sh.gpie.ts=$TS" \
            "out/layer.tar.gz:application/vnd.gpie.ext.layer.v1.tar+gzip")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Pushed $REPO:$CELL_TAG @ $digest (cell $CELL)"

      # Attest the exact pushed manifest digest so `gpie install --verify attest`
      # can verify this artifact natively (no gh CLI on the client).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
