name: Nightly prebuild

# Builds a matrix of PHP extensions inside official php images, pushes each
# compiled .so + gpie manifest to GHCR as a per-cell OCI artifact, then
# aggregates the cells of each ext@version into a single OCI image index.
# `gpie install --prefer-prebuilt` reads that index and downloads instead of
# compiling.
#
# The matrix is generated, not hand-written: `scripts/gen-prebuild-matrix.py`
# expands `.github/prebuild-targets.yml` against Packagist. See
# docs/prebuilt-oci.md for the axes and why SAPI is not one of them.

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of build shards to split the matrix across"
        required: false
        default: "8"
      only:
        description: "Build only this extension (ext_name), empty for all"
        required: false
        default: ""

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # build attestations
  attestations: write

# The index job snapshots live registry tags, so two overlapping runs could
# interleave cell pushes and publish a mixed index. Queue runs instead of
# cancelling: a cancelled run would leave cells pushed but never indexed.
concurrency:
  group: nightly-prebuild-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}/gpie-ext

jobs:
  # ---- Expand the declarative targets into shard matrices -------------------
  # GitHub caps a matrix at 256 jobs, and the full product is larger than that,
  # so the matrix is split into shards that each run as their own matrix job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      index: ${{ steps.plan.outputs.index }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan matrix
        id: plan
        env:
          SHARDS: ${{ inputs.shards || '8' }}
          ONLY: ${{ inputs.only }}
        run: |
          # `only` is a workflow input (untrusted), so it is passed through the
          # environment and charset-checked rather than interpolated.
          if [ -n "$ONLY" ] && ! printf '%s' "$ONLY" | grep -Eq '^[a-z0-9_]{1,64}$'; then
            echo "refusing malformed `only` input: $ONLY" >&2
            exit 1
          fi
          if ! printf '%s' "$SHARDS" | grep -Eq '^[0-9]{1,3}$' || [ "$SHARDS" -lt 1 ]; then
            echo "refusing malformed `shards` input: $SHARDS" >&2
            exit 1
          fi
          python3 scripts/gen-prebuild-matrix.py --check
          # A shard list the `build` job fans out over, and the deduplicated
          # ext+version list the `index` job fans out over.
          printf 'shards=' >> "$GITHUB_OUTPUT"
          python3 -c "import json,os;n=int(os.environ['SHARDS']);print(json.dumps([f'{i}/{n}' for i in range(n)]))" >> "$GITHUB_OUTPUT"
          printf 'index=' >> "$GITHUB_OUTPUT"
          python3 scripts/gen-prebuild-matrix.py --group-index >> "$GITHUB_OUTPUT"

  # ---- Build every cell of one shard ---------------------------------------
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    uses: ./.github/workflows/prebuild-shard.yml
    with:
      shard: ${{ matrix.shard }}
      only: ${{ inputs.only }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # ---- Aggregate all cells of each ext@version into one image index ---------
  index:
    needs: [plan, build]
    # `fail-fast: false` lets individual cells fail, but a matrix job with any
    # failed cell is itself failed, which would skip indexing and waste every
    # cell that did succeed. Run whenever the workflow was not cancelled; the
    # step below still skips an ext@version with no cell tags at all.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.index) }}
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin

      # Discover this version's per-cell tags and merge them into `ext:version`.
      #
      # Each child is added with `--annotation`, so the cell id lands on the
      # INDEX DESCRIPTOR as well as on the child manifest. That matters at this
      # scale: gpie's ResolvePrebuilt scans descriptors in order and, for any
      # descriptor lacking the annotation, fetches the child manifest to read
      # it. With hundreds of cells per version an unannotated index turns one
      # lookup into hundreds of serial round-trips. Annotated descriptors keep
      # a hit (and a miss) to a single GET of the index.
      # Requires oras >= 1.3 (the `manifest index` subcommand).
      - name: Create/refresh version index
        env:
          EXT_NAME: ${{ matrix.ext_name }}
          VER: ${{ matrix.version }}
        run: |
          REPO="$REGISTRY/$NAMESPACE/$EXT_NAME"
          # All per-cell tags for this version look like `<ver>-<suffix>`. Anchor
          # on the full version segment so 6.2.0 does not also match 6.2.0RC1.
          mapfile -t TAGS < <(oras repo tags "$REPO" 2>/dev/null | grep -E "^${VER}-" || true)
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "::warning::no cell tags for $REPO:$VER; nothing to index"
            exit 0
          fi
          echo "Indexing ${#TAGS[@]} cell(s) into $REPO:$VER"

          ARGS=()
          for tag in "${TAGS[@]}"; do
            # Read each child's own cell annotation and copy it onto the
            # descriptor we are about to write.
            cell="$(oras manifest fetch "$REPO:$tag" \
              --format go-template='{{index .annotations "sh.gpie.cell"}}')"
            if ! printf '%s' "$cell" | grep -Eq '^[A-Za-z0-9._@/+-]{1,200}$'; then
              echo "::warning::skipping $tag: missing or malformed sh.gpie.cell ($cell)"
              continue
            fi
            ARGS+=("--annotation" "sh.gpie.cell=$cell" "$tag")
          done
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "::warning::no annotatable cells for $REPO:$VER; nothing to index"
            exit 0
          fi
          oras manifest index create "$REPO:$VER" "${ARGS[@]}"

  # ---- Fail the run if too little of the matrix succeeded -------------------
  # Individual cell failures are expected and tolerated, but a run where most
  # cells failed means something systemic broke and should not pass silently.
  verify:
    needs: [build, index]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shard outcomes
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          INDEX_RESULT: ${{ needs.index.result }}
        run: |
          echo "build=$BUILD_RESULT index=$INDEX_RESULT"
          if [ "$INDEX_RESULT" = "failure" ]; then
            echo "indexing failed; published cells may not be reachable" >&2
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ]; then
            echo "::warning::at least one build shard reported failures; see the shard logs for the per-cell summary"
          fi
