# Declarative inputs for the nightly prebuild matrix.
#
# `scripts/gen-prebuild-matrix.py` expands this into the GitHub Actions matrix.
# Versions are NOT pinned here: the generator asks Packagist for the newest
# `keep_versions` stable releases, so upstream releases land without an edit.
#
# Axes and why each exists (see docs/prebuilt-oci.md):
#   php    PHP minor. Zend ABI is stable per minor, so this is the ABI axis.
#   bases  Base image suffix, which pins libc and every system library the .so
#          links against. The distro label that goes into the cell id is read
#          from /etc/os-release inside the container, never guessed here:
#          php:8.4-alpine3.24 reports alpine@3.24.1, and that patch level
#          floats as Alpine respins.
#   arches Native runner per arch; no QEMU.
#   ts     nts + zts, generated automatically. NOT listed here because it is
#          derived: every target builds both unless `zts: false`.
#
# SAPI (cli/fpm/apache) is deliberately absent. Those images differ only in
# --enable-embed / --enable-fpm / --with-apxs2 and phpdbg; they share CFLAGS,
# Zend API, threading and extension_dir, so one cli-built .so serves all of
# them. Adding SAPI would triple the matrix for byte-identical output.
#
# Per-extension keys:
#   package        Packagist name. Must be composer type php-ext/php-ext-zend;
#                  the generator fails if not, since gpie's resolver rejects
#                  anything else.
#   ext_name       The extension (and GHCR repo) name.
#   keep_versions  How many newest stable versions to build. Defaults to 1 --
#                  only the latest release. Cells for versions dropped out of
#                  the matrix are NOT deleted from GHCR, so anyone pinned to an
#                  older version keeps their cache hit; they just stop getting
#                  new cells (e.g. for a newly added PHP minor).
#   php / bases /  Override the defaults for this extension only.
#   arches
#   min_php        Floor that Packagist metadata does not express.
#   zts            false to skip thread-safe cells entirely.

defaults:
  php: [8.2, 8.3, 8.4, 8.5]
  bases: [bookworm, trixie, alpine3.23, alpine3.24]
  arches: [x86_64, aarch64]
  keep_versions: 1

extensions:
  # ---- Widely used, cheap to build, no source-built C library --------------
  - package: phpredis/phpredis
    ext_name: redis

  - package: xdebug/xdebug
    ext_name: xdebug

  - package: mongodb/mongodb-extension
    ext_name: mongodb

  - package: php-amqp/php-amqp
    ext_name: amqp

  # ---- Observability -------------------------------------------------------
  # open-telemetry/ext-opentelemetry declares `require.php: ^8.0`, so the
  # generator admits every default minor.
  - package: open-telemetry/ext-opentelemetry
    ext_name: opentelemetry

  # `grpc/grpc-php-ext` is the gRPC project's own extension repo
  # (github.com/grpc/grpc-php-ext, php >=8.0). NOT `grpc/grpc`, which is the
  # pure-PHP library (composer type `library`, rejected by gpie's resolver),
  # and NOT the `pie-extensions/*` / `extport/*` republishers.
  #
  # The PECL tarball bundles the whole gRPC C++ core, so a cell is tens of
  # minutes of C++ and RAM-hungry -- by far the slowest in the matrix, hence
  # the reduced axes. Packagist history only starts at v1.81.0, so there is
  # nothing older to build anyway.
  - package: grpc/grpc-php-ext
    ext_name: grpc
    bases: [bookworm, trixie]
    arches: [x86_64]

  # protobuf is deliberately ABSENT. There is no official protobuf extension on
  # Packagist: `google/protobuf` is the pure-PHP runtime (type `library`), and
  # the only php-ext packages (`pie-extensions/protobuf`, `extport/protobuf`)
  # are third-party republishers of the upstream tarball. Publishing a signed,
  # attested binary built from an unofficial republisher would launder that
  # trust into something that looks first-party, so protobuf stays a source
  # build until upstream publishes to Packagist.

# PHP-bundled extensions, built by the `docker-php-ext-*` helpers rather than
# resolved from Packagist. These have no upstream version: the source IS the PHP
# source tree, so a cell is keyed on the full PHP PATCH version, read live from
# docker-library's versions.json. An 8.4.24-built intl.so is not interchangeable
# with an 8.4.25 one, and phpApi cannot tell them apart (the Zend Module API only
# changes per minor), so the patch axis is what makes these cells safe.
#
# Why cache something that compiles in seconds: natively it is 1-10s, but on an
# emulated arm64 runner the same build is 22-105s (measured: intl 17s native ->
# 105s under QEMU, gd 55s, bcmath 39s, sockets 28s, soap 28s, zip 22s). A
# `gd intl zip soap sockets bcmath` install costs ~4.5 minutes of pure emulation
# per image build; these cells remove that.
#
# Only extensions NOT enabled by default in the official images are listed --
# caching an already-loaded extension is pointless. Verified to build on both
# Debian and Alpine at PHP 8.4 unless noted.
bundled:
  - name: bcmath
  - name: bz2
  - name: calendar
  - name: dba
  - name: enchant
  - name: exif
  - name: ffi
  - name: ftp
  - name: gd
  - name: gettext
  - name: gmp
  - name: intl
  - name: ldap
  - name: mysqli
  - name: opcache
  - name: pcntl
  - name: pdo_dblib
  - name: pdo_mysql
  - name: pdo_pgsql
  - name: pgsql
  - name: shmop
  - name: snmp
  - name: soap
  - name: sockets
  - name: sysvmsg
  - name: sysvsem
  - name: sysvshm
  - name: tidy
  - name: xsl
  - name: zip

  # Needs an explicit --with-pdo-odbc=unixODBC,/usr (see docker.configureFlags)
  # plus the unixODBC dev package, which the catalog now provides.
  - name: pdo_odbc

  # Debian-only: Alpine has no firebird development package, so configure fails.
  - name: pdo_firebird
    bases: [bookworm, trixie]

  # `odbc` is ABSENT. Its config.m4 reads `--enable-odbc=shared` (which
  # docker-php-ext-install always passes) as "enable Adabas", then looks for
  # headers under /usr/local/incl and fails. --without-adabas does not
  # override it. Left out until that is understood rather than shipped
  # half-working; `pdo_odbc` covers the common use case.
